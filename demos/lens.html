<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lens — isolated component</title>
<style>
  html,body{margin:0;height:100%;background:#0d0b0b;overflow:hidden;
    overscroll-behavior:none;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    font:400 10px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.24em;
    text-transform:uppercase;color:#6b6260;pointer-events:none;
    transition:opacity 1.2s ease;opacity:.85}
  #hint.gone{opacity:0}
  @media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hint">drag the lens · pinch to resize</div>

<script>
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DPR = Math.min(devicePixelRatio || 1, 2);

/* ══════════════════════════════════════ the content behind the glass
   A stand-in embedding atlas: narrative clusters, one company's drift
   trail, quarter labels. Drawn once to an offscreen 2D canvas, then used
   as the texture the shader refracts. */

const scene = document.createElement("canvas");
const sx = scene.getContext("2d");

const CLUSTERS = [
  { x:.26, y:.30, n:34, s:.075, name:"SUPPLY CONSTRAINT" },
  { x:.68, y:.22, n:28, s:.065, name:"EXPORT CONTROLS"  },
  { x:.78, y:.62, n:38, s:.085, name:"CAPEX GUIDANCE"   },
  { x:.34, y:.72, n:30, s:.070, name:"DEMAND VISIBILITY"},
  { x:.52, y:.46, n:22, s:.055, name:"MODEL LAUNCH"     },
];

const TRAIL = [
  { x:.30, y:.34, label:"NVDA · 2024-02-21" },
  { x:.38, y:.40, label:"2024-05-29" },
  { x:.47, y:.44, label:"2024-08-28" },
  { x:.55, y:.43, label:"2024-11-20" },
  { x:.64, y:.35, label:"2025-02-26", hot:true },
  { x:.72, y:.28, label:"2025-05-28" },
];

// deterministic noise so the atlas is the same every load
let seed = 20260817;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const gauss = () => {
  let u = 0, v = 0;
  while (!u) u = rnd();
  while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185 * v);
};

function drawScene(w, h) {
  seed = 20260817;
  scene.width = w; scene.height = h;
  const S = Math.min(w, h);

  sx.fillStyle = "#0d0b0b";
  sx.fillRect(0, 0, w, h);

  // graticule — the instrument's ruled plate
  sx.strokeStyle = "rgba(232,224,221,.030)";
  sx.lineWidth = 1;
  const step = Math.round(S / 13);
  for (let x = step; x < w; x += step) { sx.beginPath(); sx.moveTo(x + .5, 0); sx.lineTo(x + .5, h); sx.stroke(); }
  for (let y = step; y < h; y += step) { sx.beginPath(); sx.moveTo(0, y + .5); sx.lineTo(w, y + .5); sx.stroke(); }

  // cluster fields
  for (const c of CLUSTERS) {
    for (let i = 0; i < c.n; i++) {
      const px = (c.x + gauss() * c.s) * w;
      const py = (c.y + gauss() * c.s * (w / h)) * h;
      const hot = rnd() < .13;
      const r = (hot ? 2.4 : 1.5) + rnd() * 1.3;
      sx.beginPath();
      sx.arc(px, py, r * DPR, 0, 6.2832);
      sx.fillStyle = hot ? "rgba(214,162,168,.82)" : "rgba(196,186,182,.42)";
      sx.fill();
      if (hot) {
        sx.beginPath();
        sx.arc(px, py, r * 3.4 * DPR, 0, 6.2832);
        sx.fillStyle = "rgba(214,162,168,.055)";
        sx.fill();
      }
    }
  }

  // cluster names — set small; the lens is what makes them legible
  sx.font = `500 ${9.5 * DPR}px ui-monospace,"SF Mono",Menlo,monospace`;
  sx.fillStyle = "rgba(232,224,221,.34)";
  sx.textAlign = "center";
  for (const c of CLUSTERS) {
    const t = c.name.split("").join("\u2009");
    sx.fillText(t, c.x * w, (c.y - c.s * 1.9) * h);
  }

  // drift trail: one company moving through narrative space, quarter by quarter
  sx.strokeStyle = "rgba(214,162,168,.30)";
  sx.lineWidth = 1.1 * DPR;
  sx.setLineDash([4 * DPR, 4 * DPR]);
  sx.beginPath();
  TRAIL.forEach((p, i) => (i ? sx.lineTo(p.x * w, p.y * h) : sx.moveTo(p.x * w, p.y * h)));
  sx.stroke();
  sx.setLineDash([]);

  sx.textAlign = "left";
  sx.font = `400 ${10 * DPR}px ui-monospace,"SF Mono",Menlo,monospace`;
  for (const p of TRAIL) {
    const px = p.x * w, py = p.y * h;
    sx.beginPath();
    sx.arc(px, py, (p.hot ? 4.2 : 3.0) * DPR, 0, 6.2832);
    sx.fillStyle = p.hot ? "#d6a2a8" : "rgba(232,224,221,.80)";
    sx.fill();
    if (p.hot) {
      sx.beginPath();
      sx.arc(px, py, 9 * DPR, 0, 6.2832);
      sx.strokeStyle = "rgba(214,162,168,.55)";
      sx.lineWidth = 1 * DPR;
      sx.stroke();
    }
    sx.fillStyle = p.hot ? "rgba(214,162,168,.95)" : "rgba(232,224,221,.52)";
    sx.fillText(p.label, px + 10 * DPR, py + 3.5 * DPR);
  }

  // corner registration marks
  sx.strokeStyle = "rgba(232,224,221,.18)";
  sx.lineWidth = 1 * DPR;
  const m = 22 * DPR, L = 12 * DPR;
  for (const [cx, cy, dx, dy] of [[m,m,1,1],[w-m,m,-1,1],[m,h-m,1,-1],[w-m,h-m,-1,-1]]) {
    sx.beginPath();
    sx.moveTo(cx + dx * L, cy); sx.lineTo(cx, cy); sx.lineTo(cx, cy + dy * L);
    sx.stroke();
  }
}

/* ══════════════════════════════════════ the glass

   Not a blur. The fragment shader models the glass as a height field:
   flat across the middle, falling away through a curved bevel at the rim.
   Refraction offset tracks the SLOPE of that height field, so the centre
   passes light almost straight through (clear, magnified) while the bevel
   bends it hard (the smear at the edge). R/G/B sample at slightly
   different offsets, which is where the colour fringing comes from. */

const VERT = `
attribute vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const FRAG = `
precision highp float;

uniform sampler2D uScene;
uniform vec2  uRes;
uniform vec2  uLens;
uniform float uRadius;
uniform float uTime;

const float BEVEL   = 0.46;   // fraction of the radius given over to the curved edge
const float MAGNIFY = 1.46;
const float BEND    = 0.052;  // refraction strength
const float CHROMA  = 0.075;  // r/b separation

// glass thickness as a function of normalised distance from centre
float thickness(float d){
  float x = clamp((d - (1.0 - BEVEL)) / BEVEL, 0.0, 0.995);
  return sqrt(max(0.0, 1.0 - x * x));
}

void main(){
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);   // top-down px
  vec3 back = texture2D(uScene, frag / uRes).rgb;

  vec2 p   = frag - uLens;
  float len = length(p);
  float ang = atan(p.y, p.x);

  // the liquid part: the boundary breathes instead of sitting as a perfect circle
  float r = uRadius * (1.0
      + 0.021 * sin(ang * 3.0 + uTime * 0.70)
      + 0.013 * sin(ang * 5.0 - uTime * 1.10)
      + 0.008 * sin(ang * 2.0 + uTime * 0.33));

  float d = len / r;

  if (d > 1.0) {                                  // contact shadow, sells the lift
    float sh = (1.0 - smoothstep(1.0, 1.13, d)) * 0.42;
    gl_FragColor = vec4(back * (1.0 - sh), 1.0);
    return;
  }

  vec2 dir = len > 0.0001 ? p / len : vec2(0.0);

  // numeric slope of the thickness field
  float e  = 0.010;
  float dT = (thickness(min(d + e, 1.0)) - thickness(max(d - e, 0.0))) / (2.0 * e);
  dT = clamp(dT, -9.0, 0.0);

  vec2 base = uLens + p / MAGNIFY;                // magnified centre
  vec2 off  = dir * (dT * r * BEND);              // dT<0 → samples pull inward

  vec2 uvR = (base + off * (1.0 - CHROMA)) / uRes;
  vec2 uvG = (base + off) / uRes;
  vec2 uvB = (base + off * (1.0 + CHROMA)) / uRes;

  vec3 col = vec3(
    texture2D(uScene, uvR).r,
    texture2D(uScene, uvG).g,
    texture2D(uScene, uvB).b
  );

  // surface normal from the same slope → specular arc
  vec3 n = normalize(vec3(dir * (-dT) * 0.11, 1.0));
  vec3 L = normalize(vec3(-0.48, -0.72, 0.82));
  float spec = pow(max(dot(n, L), 0.0), 22.0);

  float rim = smoothstep(0.80, 0.955, d) * (1.0 - smoothstep(0.955, 0.999, d));

  col *= 1.0 + 0.07 * thickness(d);                        // body lifts a touch
  col  = mix(col, col * vec3(1.035, 0.975, 0.990), 0.65);  // faint rose in the glass
  col += vec3(1.0, 0.96, 0.965) * spec * 0.42;
  col += vec3(0.84, 0.635, 0.66) * rim * 0.34;

  float aa = 1.0 - smoothstep(1.0 - 1.6 / r, 1.0, d);
  gl_FragColor = vec4(mix(back, col, aa), 1.0);
}`;

const cv = document.getElementById("gl");
const gl = cv.getContext("webgl", { antialias: false, alpha: false, depth: false });

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "a");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

const U = {
  scene:  gl.getUniformLocation(prog, "uScene"),
  res:    gl.getUniformLocation(prog, "uRes"),
  lens:   gl.getUniformLocation(prog, "uLens"),
  radius: gl.getUniformLocation(prog, "uRadius"),
  time:   gl.getUniformLocation(prog, "uTime"),
};

/* ══════════════════════════════════════ state + input */

let W = 0, H = 0;
const lens = { x: 0, y: 0, r: 130 };
let touched = false;

function resize() {
  W = Math.round(innerWidth * DPR);
  H = Math.round(innerHeight * DPR);
  cv.width = W; cv.height = H;
  gl.viewport(0, 0, W, H);

  drawScene(W, H);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene);

  if (!touched) { lens.x = W * 0.5; lens.y = H * 0.5; }
  lens.r = Math.max(96 * DPR, Math.min(Math.min(W, H) * 0.24, 210 * DPR));
  clamp();
}
function clamp() {
  const pad = lens.r * 0.55;
  lens.x = Math.max(-pad, Math.min(W + pad, lens.x));
  lens.y = Math.max(-pad, Math.min(H + pad, lens.y));
}

const hint = document.getElementById("hint");
const dismiss = () => { touched = true; hint.classList.add("gone"); };

const pts = new Map();
let pinch0 = 0, r0 = 0;

cv.addEventListener("pointerdown", (e) => {
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX * DPR, y: e.clientY * DPR });
  dismiss();
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinch0 = Math.hypot(a.x - b.x, a.y - b.y);
    r0 = lens.r;
  }
});

cv.addEventListener("pointermove", (e) => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  const cur = { x: e.clientX * DPR, y: e.clientY * DPR };
  pts.set(e.pointerId, cur);

  if (pts.size === 2 && pinch0) {
    const [a, b] = [...pts.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    lens.r = Math.max(70 * DPR, Math.min(r0 * (dist / pinch0), Math.min(W, H) * 0.46));
  } else {
    lens.x += cur.x - prev.x;
    lens.y += cur.y - prev.y;
    clamp();
  }
});

const release = (e) => { pts.delete(e.pointerId); pinch0 = 0; };
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);

addEventListener("wheel", (e) => {
  e.preventDefault();
  dismiss();
  lens.r = Math.max(70 * DPR, Math.min(lens.r * (1 - e.deltaY * 0.0014), Math.min(W, H) * 0.46));
}, { passive: false });

addEventListener("resize", resize);
resize();

/* ══════════════════════════════════════ loop */

const t0 = performance.now();
let idle = 0;

function frame(now) {
  const t = (now - t0) / 1000;

  // before first touch, drift gently so it reads as a physical object at rest
  if (!touched && !REDUCED) {
    idle += 0.006;
    lens.x = W * 0.5 + Math.sin(idle) * W * 0.055;
    lens.y = H * 0.5 + Math.cos(idle * 0.72) * H * 0.040;
  }

  gl.uniform1i(U.scene, 0);
  gl.uniform2f(U.res, W, H);
  gl.uniform2f(U.lens, lens.x, lens.y);
  gl.uniform1f(U.radius, lens.r);
  gl.uniform1f(U.time, REDUCED ? 0 : t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
